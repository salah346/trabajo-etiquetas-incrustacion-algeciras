<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Algeciras - Lugares de interés</title>
    <style>
        body {
            font-family: Arial;
        }
        header, footer {
            background-color: #eeeeee;
        }
    </style>
</head>
<body>
    <header>
        <h1>Lugares de interés de Algeciras</h1>
        <nav>
            <a href="index.html">Volver al inicio</a>
        </nav>
    </header>
    <main>
        <h2>1. Imagen</h2>
        <img src="https://picsum.photos/id/1040/500/300" alt="Ciudad de Algeciras">

        <h2>2. Mapa con iframe</h2>
        <iframe src="https://maps.google.com/maps?q=Algeciras%2C%20C%C3%A1diz&output=embed" width="500" height="300"></iframe>

        <h2>3. Página web con iframe</h2>
        <iframe src="https://es.wikipedia.org/wiki/Algeciras" width="500" height="300"></iframe>

        <h2>4. Vídeo con video y source</h2>
        <video width="500" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>

        <h2>5. Audio</h2>
        <audio src="audio2.mp3" controls></audio>

        <h2>6. embed</h2>
        <embed src="audio2.mp3" width="300" height="50" type="audio/mpeg">

        <h2>7. object</h2>
        <object data="https://picsum.photos/id/1040/500/300" width="500" height="300" type="image/jpeg">
        </object>

        <h2>8. svg</h2>
        <svg width="300" height="150" style="border:1px solid black;">
            <text x="150" y="80" font-size="25" text-anchor="middle" fill="black">Algeciras</text>
        </svg>
    </main>
</body>
</html>
